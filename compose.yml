services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./backend/key:/home/bun/.ssh/key
      - ./backend/key.pub:/home/bun/.ssh/key.pub
    env_file:
      - .env
    environment:
      - DB_URL=http://db/rpc
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAMESPACE=development
      - DB_NAME=dev
      - LLM_MODEL=llama-3.3-70b-versatile
    expose:
      - 80
    ports:
      - 8080:80
    command: bun run --hot index.ts
    depends_on:
      - db
  frontend:
    image: oven/bun:1.2.5
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    ports:
      - 80:80
    env_file:
      - .env
    environment:
      - LLM_MODEL=gemma2-9b-it
    command: bun run dev -- --host 0.0.0.0 --port 80
  db:
    image: surrealdb/surrealdb:v2.0.0
    user: root
    expose:
      - 80
    ports:
      - 8000:80
    command: start --user root --pass root --bind 0.0.0.0:80 rocksdb://data/database.db
    volumes:
      - db:/data
  git:
    build: ./git
    restart: always
    volumes:
      - ./git/key.pub:/home/root/.ssh/authorized_keys
      - .git:/var/git/netter
    expose:
      - 22

volumes:
  db:
  git:
