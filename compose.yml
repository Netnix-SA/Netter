services:
  backend:
    image: oven/bun:1.1.38
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DB_URL=http://db/rpc
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAMESPACE=development
      - DB_NAME=dev
      - LLM_MODEL=llama-3.3-70b-versatile
    expose:
      - 80
    ports:
      - 80:80
    command: bun run --hot index.ts
    depends_on:
      - db
  frontend:
    image: oven/bun:1.1.38
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    ports:
      - 5173:80
    env_file:
      - .env
    command: bun run dev -- --host --port 80
  db:
    image: surrealdb/surrealdb:v2.0.0
    user: root
    expose:
      - 80
    ports:
      - 8000:80
    command: start --user root --pass root --bind 0.0.0.0:80 rocksdb://data/database.db
    volumes:
      - db:/data

volumes:
  db:
